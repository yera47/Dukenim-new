packages:
  - "apps/*"

allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true
storeDir: .pnpm-store

overrides:
  postcss: 8.5.28
  "nanoid@<3.3.18": 3.3.18
  "decode-uri-component@<=0.4.2": 0.5.0
  "uuid@<11.1.1": 11.1.1
  "js-yaml@<4.3.2": 4.3.2

minimumReleaseAgeExclude:
  - '@expo/cli@57.0.27'
  - '@expo/router-server@57.0.11'
  - babel-preset-expo@57.0.13
  - expo-modules-core@57.0.19
  - expo-modules-jsi@57.1.1
  - expo@57.0.25
  - '@expo/ui@57.0.20'
  - expo-glass-effect@57.0.4
  - expo-image-picker@57.0.20
  - expo-linking@57.0.11
  - expo-notifications@57.0.21
  - expo-router@57.0.23
  - expo-widgets@57.0.21
